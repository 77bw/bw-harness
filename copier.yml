_subdirectory: templates/python
package_name:
  type: str
  default: sample_project
  validator: "{% if not (package_name.isascii() and package_name.isidentifier() and package_name.islower() and package_name[0].isalpha() and package_name not in 'and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split()) %}Use a lowercase Python identifier{% endif %}"
research:
  type: bool
  default: false
api:
  type: bool
  default: false
