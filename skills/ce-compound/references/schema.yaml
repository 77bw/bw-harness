# ce-compound 编写的学习文档架构
# 将其视为复合学习的规范前沿契约。
#
# 该模式有两个基于 problem_type 的轨道：
# Bug 跟踪 — problem_type 是缺陷或故障（build_error、test_failure 等）
# 知识轨迹——problem_type是指导或练习（best_practice、workflow_issue等）
#
# 两个轨道共享相同的所需核心字段。曲目的不同之处在于
# 附加字段是必填字段还是可选字段（请参阅下面的track_rules）。

# 在固定引用 (compound-cli) 处加载此文件的工具的合同版本。
# 仅当文件形状发生变化时才进行凹凸，而不是在添加值时进行凹凸。
schema_version: 1

# --- Track classification ---------------------------------------------------
tracks:
  bug:
    description: "已诊断和修复的缺陷、故障和错误"
    problem_types:
      - build_error
      - test_failure
      - runtime_error
      - performance_issue
      - database_issue
      - security_issue
      - ui_bug
      - integration_issue
      - logic_error
  knowledge:
    description: "实践、模式、惯例、决策、工作流程改进和文档"
    problem_types:
      - best_practice
      - documentation_gap
      - workflow_issue
      - developer_experience
      - architecture_pattern
      - design_pattern
      - tooling_decision
      - convention

# --- Fields required by BOTH tracks -----------------------------------------
required_fields:
  module:
    type: string
    description: "受影响的模块或区域"

  date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: "记录日期 (YYYY-MM-DD)"

  problem_type:
    type: enum
    values:
      - build_error
      - test_failure
      - runtime_error
      - performance_issue
      - database_issue
      - security_issue
      - ui_bug
      - integration_issue
      - logic_error
      - developer_experience
      - workflow_issue
      - best_practice
      - documentation_gap
      - architecture_pattern
      - design_pattern
      - tooling_decision
      - convention
    description: "主要类别 - 确定轨道（错误与知识）。优先选择最窄的适用值； best_practice 是当没有更窄的知识轨道值适合时的后备。"

  component:
    type: string
    suggested_values:
      - data_model
      - api_layer
      - service_layer
      - background_job
      - database
      - frontend
      - messaging
      - infrastructure
      - observability
      - authentication
      - payments
      - development_workflow
      - testing_framework
      - documentation
      - tooling
    description: "涉及的组件或区域。开放词汇：根据yaml-schema.md中的语料库优先规则选择它（该区域的语料库值，当语料库不一致时最常用的拼写，suggested_values仅当没有文档覆盖该区域时；语料库值按拼写重复使用）。新选择的 suggested_values 后备是小写，下划线分隔。"

  severity:
    type: enum
    values:
      - critical
      - high
      - medium
      - low
    description: "影响严重程度"

# --- Track-specific rules ----------------------------------------------------
track_rules:
  bug:
    required:
      symptoms:
        type: array[string]
        min_items: 1
        max_items: 5
        description: "可观察到的症状，例如错误或破坏行为"
      root_cause:
        type: string
        suggested_values:
          - wrong_api
          - data_integrity
          - concurrency
          - async_timing
          - memory_leak
          - config_error
          - logic_error
          - test_isolation
          - missing_validation
          - missing_permission
          - missing_workflow_step
          - inadequate_documentation
          - missing_tooling
          - incomplete_setup
        description: "问题的根本技术原因。开放词汇，成分优先规则，由原因本身而不是领域来匹配。"
      resolution_type:
        type: enum
        values:
          - code_fix
          - migration
          - config_change
          - test_fix
          - dependency_update
          - environment_setup
          - workflow_improvement
          - documentation_update
          - tooling_addition
          - seed_data_update
        description: "应用的修复类型"

  knowledge:
    optional:
      applies_when:
        type: array[string]
        max_items: 5
        description: "本指南适用的条件或情况"
      symptoms:
        type: array[string]
        max_items: 5
        description: "促成本指南的可观察差距或摩擦（知识轨道可选）"
      root_cause:
        type: string
        suggested_values:
          - wrong_api
          - data_integrity
          - concurrency
          - async_timing
          - memory_leak
          - config_error
          - logic_error
          - test_isolation
          - missing_validation
          - missing_permission
          - missing_workflow_step
          - inadequate_documentation
          - missing_tooling
          - incomplete_setup
        description: "根本原因（如果有特定原因）（知识轨道可选）。开放词汇，成分优先规则，由原因本身而不是领域来匹配。"
      resolution_type:
        type: enum
        values:
          - code_fix
          - migration
          - config_change
          - test_fix
          - dependency_update
          - environment_setup
          - workflow_improvement
          - documentation_update
          - tooling_addition
          - seed_data_update
        description: "变更类型（如果适用）（知识轨道可选）"

# --- Fields optional for BOTH tracks ----------------------------------------
optional_fields:
  title:
    type: string
    description: "明确的问题或指导标题；解决方案模板将其写入每个新文档中"

  category:
    type: string
    description: "文档所在的解决方案子目录；解决方案模板将其写入每个新文档中"

  status:
    type: enum
    values:
      - stale
    description: "仅通过学习刷新来设置，无法确认该文档是否仍然有效。学习研究人员仍然显示该文档，并用 stale_reason 标记为过时。稍后刷新解决文档会删除状态、stale_reason 和 stale_date。"

  stale_reason:
    type: string
    description: "刷新发现了什么让文档感到不安；仅存在状态：陈旧"

  stale_date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: "文档被标记为过时的日期 (YYYY-MM-DD)；仅存在状态：陈旧"

  related_components:
    type: array[string]
    description: "涉及的其他组件"

  tags:
    type: array[string]
    max_items: 8
    description: "搜索关键字，小写且连字符分隔"

  retire_when:
    type: string
    description: "存储库外部的更改将取消此学习，以及刷新如何在不更改存储库的情况下检查它，例如\\“example-org/sdk#1234 已在已发布的 sdk 版本中修复为已关闭；检查问题和 sdk 发行说明\\”。仅当指南成立且存储库外部的某些内容成立时才设置它：开放的上游错误、工具或平台版本、依赖项的行为。否则省略它。需要更改存储库的验证（例如删除解决方法并重新运行 CI）属于删除之前的步骤。"

# --- Fields optional for bug track only -------------------------------------
bug_optional_fields:
  framework_version:
    type: string
    description: "观察到错误的框架或运行时名称和版本，例如“rails 7.1.2”或“节点 22.4.0”。仅与错误跟踪文档相关。"

# --- Backward compatibility --------------------------------------------------
# 在引入跟踪系统之前创建的文档可能存在错误跟踪
# 知识类型字段（症状、root_cause、resolution_type）
# problem_types。这些是有效的遗留文档：
#   - Bug-track fields present on a knowledge-track doc are harmless. Do not
# 在刷新期间删除它们，除非文档因其他原因被重写。
#   - When creating NEW docs, follow the track rules above.
# 在component/root_cause成为开放词汇之前编写的文档可能会携带
# 先前关闭列表中的值 (rails_*, hotwire_turbo, missing_include,
# ...) or a rails_version field. They stay valid; the corpus-first rule means a
# 其文档始终使用这些值的存储库将继续使用它们。

# --- Validation rules --------------------------------------------------------
validation_rules:
  - "Determine track from problem_type using the tracks section above"
  - "All shared required_fields must be present"
  - "Bug-track required fields (symptoms, root_cause, resolution_type) must be present on bug-track docs"
  - "Knowledge-track docs have no additional required fields beyond the shared ones"
  - "Bug-track fields on existing knowledge-track docs are harmless (see backward compatibility note)"
  - "Track-specific optional fields may be included but are not required"
  - "Enum fields (problem_type, severity, resolution_type, status) must match allowed values exactly"
  - "status, stale_reason and stale_date appear together or not at all"
  - "Open-vocabulary fields (component, root_cause) follow the corpus-first rule in yaml-schema.md: component is matched by area (the value existing docs under <root>/solutions/ use for that area, most-used spelling when existing docs disagree), root_cause is matched by the cause itself (the value existing docs use for that same cause, most-used spelling when existing docs disagree), suggested_values only when no existing doc covers the area (component) or names the cause (root_cause). Do not coin a near-synonym of a value the corpus already uses"
  - "Array fields must respect min_items/max_items when specified"
  - "date must match YYYY-MM-DD format"
  - "framework_version, if provided, only applies to bug-track docs"
  - "retire_when is optional on both tracks; when present it is one string, and a doc without it stays valid"
  - "tags should be lowercase and hyphen-separated"
  - "Array-of-strings frontmatter items (symptoms, applies_when, tags, related_components, or any future array field) must be wrapped in double quotes when the value starts with a YAML reserved indicator (`, [, *, &, !, |, >, %, @, ?) or contains the substring `: ` — otherwise strict YAML parsers reject the file"
