# 实验日志模式
# 这是累积的实验日志文件的规范模式
# 整个优化运行。
#
# Location: <state-root>/experiment-log.yaml, where <state-root> is the durable
# 状态根在阶段 0 (references/persistence.md) 中解决：线束的
# 当耐用商店命名时，否则
# .context/compound-engineering/ce-optimize/<spec-name>/
#
# 持久性模型：
# 磁盘上的实验日志是唯一的事实来源。代理的
# 内存中的上下文是可消耗的，并且会在长时间运行期间被压缩。
#
# 写纪律：
# - Each experiment gets one log entry, appended on its first measurement
# （SKILL.md步骤3.3），批量评估之前
# - Later ladder samples for that experiment update the same entry in place
# - Outcome fields may also be updated in-place after batch evaluation (step 3.5)
# - The `best` section is updated after each batch if a new best is found
# - The `hypothesis_backlog` is updated after each batch
# - `approval` is written once, the moment the Phase 1 gate is cleared
# - `run_state` is written at CP-4 and whenever a pending wait is registered
# 或清除
# - The agent re-reads this file from disk at every phase boundary
#
# 编排器不会在每次迭代时读取完整的日志——它使用
# 滚动窗口（最后 10 个实验）+ 策略摘要文件
# 假设生成。但完整日志存在于磁盘上以供恢复，
# 崩溃恢复和运行后分析。

# ============================================================================
# 顶层结构
# ============================================================================

structure:

  spec:
    type: string
    required: true
    description: "该日志所属的优化规范的名称"

  run_id:
    type: string
    required: true
    description: "此优化运行的唯一标识符（基于时间戳）。区分恢复运行和新启动。"

  started_at:
    type: string
    format: "ISO 8601 timestamp"
    required: true

  baseline:
    type: object
    required: true
    description: "在任何优化之前对原始代码测量的指标"
    children:
      timestamp:
        type: string
        format: "ISO 8601 timestamp"
      gates:
        type: object
        description: "门指标名称与其基线值的键值对"
      metrics:
        type: object
        description: "decide.mjs 加载所需的硬目标快照（聚合加样本）以供以后比较"
      diagnostics:
        type: object
        description: "诊断指标名称与其基线值的键值对"
      worst_cases:
        type: array
        description: "从测量输出或判断原因来看，少数最差的每种情况结果（项目、测试、查询）出现了问题。解释分数；永远不会改变它"
        items:
          type: object
          children:
            case_id:
              type: string
            score:
              type: string
            reason:
              type: string
      judge:
        type: object
        description: "评判基线分数（仅当主要类型为“评判”时）"
        children:
          # 评分配置中的所有字段都显示在此处
          # Plus:
          sample_seed:
            type: integer
          judge_cost_usd:
            type: number

  harness_validation:
    type: object
    required: false
    description: "第 1 阶段指标有效性门的结果，写在基线之前的 CP-1 处。遗留日志中不存在意味着该门未运行，而不是它已通过。"
    children:
      timestamp:
        type: string
        format: "ISO 8601 timestamp"
      separates_known_good_from_bad:
        type: boolean
        description: "在度量方向上，该工具对每个已知的良好样本的评分高于每个已知的不良样本；当不存在范例且未运行探测器时为 null"
      rejects_trivial_shortcut:
        type: boolean
        description: "空的、常量的或复制的输出得分不等于或高于已知的良好范例"
      judge_agreement:
        type: number
        description: "法官同意的校准标签分数（仅限初级法官；放弃或不适用时为空）"
      calibration:
        type: enum
        values: [passed, waived, not_run, not_applicable]
      waiver:
        type: string
        description: "谁放弃了校准以及何时放弃了用户消息中的逐字记录（仅当放弃校准时）"
      holdout_configured:
        type: boolean
        description: "是否为本次运行配置了保留确认集"
      probes:
        type: array
        description: "每次探测运行一条记录：名称、使用的输入、观测值和 pass/fail"

  experiments:
    type: array
    required: true
    description: "所有实验的有序列表，包括保留、恢复、错误和推迟"
    items:
      type: object
      # 请参阅下面的实验条目

  best:
    type: object
    required: true
    description: "当前最好成绩总结"
    children:
      iteration:
        type: integer
        description: "最佳实验的迭代次数（在保留任何实验之前使用 0 作为基线快照）"
      metrics:
        type: object
        description: "当前最佳状态的所有指标值（CP-1 期间具有基线指标的种子）"
      judge:
        type: object
        description: "判断最佳实验的分数（仅当主要类型为“判断”时）"
      total_judge_cost_usd:
        type: number
        description: "所有实验中所有判断成本的总计"
      total_run_cost_usd:
        type: number
        description: "整个运行模型支出的运行估算：实验人员、法官和研究子代理"
      run_cost_basis:
        type: string
        description: "total_run_cost_usd 的哪些部分来自主机报告的使用情况，哪些是估计值"

  approval:
    type: object
    required: false
    description: >
      The Phase 1 user approval, recorded so a resume (including an unattended
      wake) does not re-ask it. Valid while spec_sha256 matches the SHA-256 of
      the spec.yaml bytes on disk and every cap below matches the spec. Absent,
      or no longer matching, means the gate is presented again. Missing in
      legacy logs means the gate is presented again on resume, as before.
    children:
      approved_at:
        type: string
        format: "ISO 8601 timestamp"
      spec_sha256:
        type: string
        description: "批准时保存的 spec.yaml 字节的 SHA-256 十六进制摘要"
      caps:
        type: object
        description: "用户批准的限制：停止。*生效，metric.judge.max_total_cost_usd（仅在明确的 uncapped-spend yes 时为空），执行。max_concurrent"

  run_state:
    type: object
    required: false
    description: >
      Tick-level loop state for resume across turns. Written at CP-4 and
      whenever a pending wait is registered or cleared. Absent in a log that
      has not reached Phase 3 or in a legacy log; treat absent clocks as zero
      and absent pending_waits as none.
    children:
      status:
        type: string
        enum: [running, waiting, blocked, final]
        description: "在蜱虫内运行；等待记录的挂起等待或用户的总结选择；被循环外的某些东西阻塞（报告它，不要旋转）； CP-5之后的决赛"
      tick:
        type: integer
        description: "到目前为止已完成的刻度（批次）"
      phase3_started_at:
        type: string
        format: "ISO 8601 timestamp"
        description: "用于停止的挂钟锚。max_wall_hours"
      active_seconds:
        type: number
        description: "自第 3 阶段开始以来在蜱内花费的时间，对各个蜱虫进行求和；时钟停止。max_hours 读数"
      pending_waits:
        type: array
        description: "在转弯边界上表现出色。当没有什么突出的时候就空了。回合结束条件，包括截止时间计时器和手动恢复回交，在persistence.md（等待记录和刻度）中定义。"
        items:
          type: object
          children:
            item:
              type: string
              description: "突出之处：实验迭代、判断批次、计时器"
            arrives_as:
              type: string
              description: "唤醒传递的可观察对象：存储文件、推送的引用、命名启动的主机消息、计时器触发"
            wake:
              type: string
              description: "已注册的唤醒标识符或描述，或者对于手动恢复检查点不可用"
            on_arrival:
              type: string
              description: "采取的行动：通过3.3收集、评估、重新检查停止"

  hypothesis_backlog:
    type: array
    description: "其余假设尚未检验"
    items:
      type: object
      children:
        description:
          type: string
        category:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        dep_status:
          type: string
          enum: [approved, needs_approval, not_applicable]
        required_deps:
          type: array
          items:
            type: string
        opportunity:
          type: object
          description: "实施前的机会记录；见下文opportunity_record。对于遗留日志是可选的。"

opportunity_record:
  children:
    workload:
      type: string
      description: "代表性工作负载和输入标识"
    baseline:
      type: string
      description: "估计收益所依据的修订或记录的快照"
    evidence:
      type: string
      description: "源位置和观察到的单位成本或工作负载份额；定性工作的标题证据"
    expected_benefit:
      type: string
      description: "目标指标、单位、预期 reduction/increase 范围或上限以及假设；未知，缺乏证据，并且在不可估计时最便宜的解决测量"
    confidence:
      type: string
      description: "信心以及证明信心的证据或不确定性"
    cost_and_risk:
      type: string
      description: "估计的实施和测量工作、行为风险以及所需的正确性检查"

# ============================================================================
# 实验入口
# ============================================================================

experiment_entry:
  required_children:

    iteration:
      type: integer
      description: "顺序实验数（1索引，单调递增）"

    batch:
      type: integer
      description: "该实验所属的批次号。同一批中的多个实验并行进行。"

    hypothesis:
      type: string
      description: "该实验所尝试内容的人类可读描述"

    category:
      type: string
      description: "分组和多样性选择的类别（例如，信号提取、图信号、嵌入、算法、预处理）"

    outcome:
      type: enum
      values:
        - measured                # measurement finished and metrics were persisted, awaiting batch evaluation / integration
        - promising               # eligible on current samples but the ladder still needs confirmation before keep
        - kept                    # eligible, confirmed, and integrated onto the optimization branch
        - not_selected            # eligible after comparison but not integrated (not the winner, overlapping, or past the runner-up cap)
        - reverted                # compared and not eligible (regressed a required objective, or none improved), or eligible but its gain did not come from doing the work the metric stands for (loop 3.4)
        - inconclusive            # delta inside the comparison threshold; not a keep and not a demonstrated regression
        - censored                # aborted as noncompetitive under the predeclared futility bound
        - degenerate              # degenerate gate or smoke test failed -> immediately reverted, no judge evaluation
        - error                   # measurement command crashed, timed out, or produced malformed output
        - deferred_needs_approval # experiment needs an unapproved dependency -> set aside for batch approval
        - timeout                 # measurement command exceeded timeout_seconds
        - runner_up_kept          # file-disjoint runner-up that was cherry-picked and re-measured successfully
        - runner_up_reverted      # file-disjoint runner-up that was cherry-picked but combined measurement was not better
      description: >
        The loop branches on this value.
        'measured' and 'promising' are non-terminal: CP-3 persists raw metrics
        before batch-level comparison, and 'promising' means the ladder still
        needs confirmation samples. An eligible decide `keep` stays `measured`
        until its diff is on the optimization branch. 'kept' and 'runner_up_kept'
        mean that integration happened. 'not_selected' is terminal for an
        eligible candidate that was not integrated. 'deferred_needs_approval'
        items are re-presented at wrap-up. All other states are terminal for
        that experiment.

  optional_children:

    opportunity:
      type: object
      description: "本实验实施前制作的opportunity_record副本；从未根据其结果重建。遗留日志中缺失意味着未记录。"

    comparisons:
      type: array
      description: "决策中使用的每个不同 reference/candidate/workload 配对有一条记录。稍后的就地更新不得取代先前保留的不同配对。缺乏遗留证据是未知的，不能从当前最好的证据中推断出来。"
      items:
        type: object
        children:
          kind:
            type: string
            enum: [standalone, integrated, holdout]
            description: "保留配对在保留前和最终确认时对保留组进行评分；他们从不提供选择或假设生成"
          reference_revision:
            type: string
            description: "唯一标识测量的参考字节的身份。当它命名这些字节时，修订就足够了；不同未提交树共享的HEAD则不是。"
          candidate_revision:
            type: string
            description: "唯一标识测量的候选字节的身份。当它命名这些字节时，修订就足够了；不同未提交树共享的HEAD则不是。"
          workload:
            type: string
          machine:
            type: string
            description: "产生该配对双方的机器或工人的稳定标识符，包括每种类型，包括抵抗。显示远程后端结果；缺席意味着本次结帐。来自不同机器的配对永远不会与彼此的绝对数量进行比较。"
          measured_by:
            type: string
            enum: [orchestrator, worker, confirmation_worker]
            description: "谁创造了这对组合，无论是哪种组合，包括坚持。远程获胜者在保留之前需要一个工作配对和一个不是由候选人作者生成的配对；远程保留配对始终是协调器或confirmation_worker，而不是工作人员。"
          reference:
            type: object
            description: "现有快照形状：指标和判断，以及可用的聚合和样本"
          candidate:
            type: object
            description: "现有快照形状：指标和判断，以及可用的聚合和样本"
          uncertainty:
            type: string
            description: "配置的比较方法、观察到的变异性、确认状态以及任何缺失的不确定性证据"
          correctness:
            type: string
            description: "执行的检查和结果或确切的未经验证的约束；仅通过时间比较并不能证明正确性"

    changes:
      type: array
      description: "本实验修改的文件"
      items:
        type: object
        children:
          file:
            type: string
          summary:
            type: string

    gates:
      type: object
      description: "来自测量命令的门控度量值"

    gates_passed:
      type: boolean
      description: "是否所有简并门都通过了"

    diagnostics:
      type: object
      description: "来自测量命令的诊断指标值"

    metrics:
      type: object
      description: "decide.mjs 加载所需的硬目标快照（聚合加样本）"

    judge:
      type: object
      description: "评委评估分数（仅当主要类型为“评委”且通过关卡时）"
      children:
        # Scoring.primary 和 Scoring.Secondary 的所有字段均显示在此处
        # Plus:
        judge_cost_usd:
          type: number
          description: "法官要求进行这项实验的成本"
        items:
          type: array
          description: "每个项目的评判结果。反馈是假设生成所读取的内容；仅凭分数无法说明要改变什么。"
          items:
            type: object
            children:
              item_id:
                type: string
              content_hash:
                type: string
                description: "判断出的item字节的Hash；运行判断缓存的键，因此不会重新判断相同的输出"
              reason:
                type: string
                description: "分数解释保留在worst_cases中并与裁判结果一起缓存"
              feedback:
                type: string
                description: "法官认为这个项目有什么问题以及需要做什么修改才能解决这个问题"
              ambiguous:
                type: boolean
              # 加上标题要求的每个评分字段

    cost:
      type: object
      description: "当安全带或裁判报告时记录每次实验的诊断结果；否则缺席。从来没有上过门。"
      children:
        usd:
          type: number
        tokens:
          type: integer
        latency_seconds:
          type: number

    regressions:
      type: array
      description: "Case id 引用已通过，而该候选失败，从 decide.mjs 当measurement.per_case 为真时开始。仅报告。"
      items:
        type: string

    worst_cases:
      type: array
      description: "与基线形状相同。worst_cases，对于本实验的最新测量"

    primary_delta:
      type: string
      description: "主要指标相对于当前最佳值的变化（例如“+0.7”、“-0.3”）"

    objective_results:
      type: object
      description: "从 decide.mjs 进行按要求的目标比较（结论、增量、相对）"

    sample_count:
      type: integer
      description: "本次实验花费了多少线束样品"

    next_measurement:
      type: string
      enum: [none, smoke, exploratory, add_sample, confirm, holdout]
      description: "从decide.mjs开始阶梯下一步；当决定是最终的时，没有。 Holdout 表示选择比较将保留，并且保留的比较仍然缺失。"

    learnings:
      type: string
      description: "从这个实验中学到了什么。代理读取这些以避免重新尝试类似的方法并通知新的假设生成。对于一个返回者来说，其收益不是来自于做工作，这就是安全带缺乏的观察或约束。"

    commit:
      type: string
      description: "Git 在优化分支上提交 SHA（仅适用于“保留”和“runner_up_kept”结果）"

    deferred_reason:
      type: string
      description: "为什么这个实验被推迟（仅针对“deferred_needs_approval”结果）"

    error_message:
      type: string
      description: "错误详细信息（仅适用于“错误”和“超时”结果）"

    merged_with:
      type: integer
      description: "与之合并的实验的迭代次数（仅适用于“runner_up_kept”和“runner_up_reverted”）"

# ============================================================================
# 结果标记 (result.yaml)
# ============================================================================
#
# 由测量方在测量后、CP-3 之前立即编写。
# 本地后端仅使用指标将其写入实验工作树根。
# 远程工作人员将其写入其签出根，将其提交到结果引用上，
# 编排器将其复制到<state-root>/exp-<NNN>-result.yaml。

result_marker:
  children:
    experiment:
      type: integer
    base_sha:
      type: string
      description: "承诺工作人员从基线开始并作为基线进行测量；必须等于调度的 base_sha 否则结果是错误的"
    head_sha:
      type: string
      description: "候选提交（仅限可变范围更改）； result.yaml 在其之上单独提交，因此结果引用的提示将 head_sha 作为其父级（仅限远程）"
    machine:
      type: string
      description: "测量机或工人的稳定标识符（仅限远程）"
    measured_at:
      type: string
      format: "ISO 8601 timestamp"
    baseline:
      type: object
      description: "同一台机器上 base_sha 的配对快照：门、指标 { name: {aggregate、samples } }、诊断（仅限远程）"
    candidate:
      type: object
      description: "head_sha的快照；本地后端仅写入这一侧的原始指标"
    correctness:
      type: string
      description: "检查测量方运行及其结果，或无"

# ============================================================================
# 结果状态转换
# ============================================================================
#
# 提议（hypothesis_backlog）
#   -> selected for batch
#     -> experiment dispatched
#       -> measurement completed
#         -> gates failed           -> outcome: degenerate
#         -> measurement error      -> outcome: error
#         -> measurement timeout    -> outcome: timeout
#         -> smoke failed           -> outcome: degenerate
#         -> futile / censored      -> outcome: censored
#         -> gates passed
#           -> persist raw metrics   -> outcome: measured or promising
#           -> judge evaluated (if type: judge)
#             -> decide.mjs eligible, next_measurement none -> stay measured until integration
#               -> diff on optimization branch -> outcome: kept
#               -> eligible leftover             -> outcome: not_selected
#             -> runner-up, file-disjoint -> cherry-pick + re-measure
#               -> combined eligible and integrated -> outcome: runner_up_kept
#               -> combined not kept              -> outcome: runner_up_reverted
#             -> inconclusive             -> outcome: inconclusive
#             -> not eligible             -> outcome: reverted
#       -> needs unapproved dep    -> outcome: deferred_needs_approval
#
# 只有“kept”和“runner_up_kept”才会在优化分支上生成提交。
# 只有“deferred_needs_approval”项目会在总结时重新呈现以供批准。

# ============================================================================
# 策略摘要（单独文件）
# ============================================================================
#
# 每批之后写到：
# <state-root>/strategy-digest.md
#
# 包含以下内容的压缩摘要：
# - What hypothesis categories have been tried
# - Which approaches succeeded (kept) and which failed (reverted)
# - The exploration frontier: what hasn't been tried yet
# - Key learnings that should inform next hypotheses
# - Failure themes: recurring judge `feedback` (or failing `cases`) on the
# 目前最好的，分组的，有计数的。由选择样本项目构建
# 仅有的;坚持的项目永远不会出现在这里。
#
# 协调器读取策略摘要（而不是完整的实验日志）
# 在批次之间生成新假设时。

# ============================================================================
# 判断缓存（单独文件）
# ============================================================================
#
# 当法官结果落地时，写至：
# <state-root>/judge-cache.yaml
