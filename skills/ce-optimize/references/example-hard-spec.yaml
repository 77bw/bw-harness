# 用于客观指标的最小首次运行模板。
# 当“更好”是来自测量工具的标量值时，从这里开始。

name: improve-build-latency
description: "减少构建延迟而不降低正确性"

metric:
  primary:
    type: hard
    name: build_seconds
    direction: minimize
  degenerate_gates:
    - name: build_passed
      check: "== 1"
      description: "构建必须保持绿色"
    - name: test_pass_rate
      check: ">= 1.0"
      description: "必需的测试必须持续通过"
  diagnostics:
    - name: artifact_size_mb
    - name: peak_memory_mb

measurement:
  command: "python evaluate.py"
  timeout_seconds: 300
  working_directory: "tools/eval"
  stability:
    mode: repeat
    repeat_count: 3
    aggregation: median
    noise_threshold: 0.05

scope:
  mutable:
    - "src/build/"
    - "config/build.yaml"
  immutable:
    - "tools/eval/evaluate.py"
    - "tests/fixtures/"
    - "scripts/ci/"

execution:
  mode: serial
  backend: worktree
  max_concurrent: 1

parallel:
  port_strategy: none
  shared_files: []

dependencies:
  approved: []

constraints:
  - "Keep output artifacts backward compatible"
  - "Do not skip required validation steps"

stopping:
  max_iterations: 4
  max_hours: 1
  plateau_iterations: 3
  target_reached: true

max_runner_up_merges_per_batch: 0
