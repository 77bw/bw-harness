# 优化规范架构
# 这是用户创建的优化规范文件的规范模式
# 配置 /ce-optimize 运行。编排代理验证规范
# 在继续之前针对此模式。
#
# Usage: Create a YAML file matching this schema and pass it to /ce-optimize.
# 代理读取此规范，验证必填字段，并使用它来
# 配置整个优化运行。

# ============================================================================
# 必填字段
# ============================================================================

required_fields:

  name:
    type: string
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    description: "此优化运行的唯一标识符（小写的 kebab-case，对于 git refs 和工作树路径是安全的）"
    example: "improve-issue-clustering"

  description:
    type: string
    description: "优化目标的人类可读描述"
    example: "Improve coherence and coverage of issue/PR clusters"

  metric:
    type: object
    description: "三层指标配置"
    required_children:

      primary:
        type: object
        description: "循环优化的指标"
        required_children:

          type:
            type: enum
            values:
              - hard    # scalar metric from measurement command (e.g., build time, test pass rate)
              - judge   # LLM-as-judge quality score from sampled outputs
            description: "主要指标是直接来自测量命令还是来自LLM作为法官的评估"

          name:
            type: string
            description: "指标名称：必须与测量命令的 JSON 输出中的键（对于硬类型）或评分字段（对于判断类型）匹配"
            example: "cluster_coherence"

          direction:
            type: enum
            values:
              - maximize
              - minimize
            description: "是越高好还是越低越好"

        optional_children:

          baseline:
            type: number
            default: null
            description: "在第 1 阶段基线测量期间自动填充。不要手动设置。"

          target:
            type: number
            default: null
            description: "可选目标值。达到此值时循环停止。设置 metric.objectives 后，target_reached 需要声明目标的每个必需目标。"
            example: 4.2

      degenerate_gates:
        type: array
        description: "快速布尔检查，在昂贵的评估之前拒绝明显损坏的解决方案。在主要指标或判断之前先运行。"
        required: true
        items:
          type: object
          required_children:
            name:
              type: string
              description: "指标名称：必须与测量命令的 JSON 输出中的键匹配"
            check:
              type: string
              description: "比较运算符和阈值。支持的运算符：>=、<=、>、<、==、!="
              example: "<= 0.10"
          optional_children:
            description:
              type: string
              description: "该门捕获的内容的人类可读的解释"

    optional_children:

      objectives:
        type: array
        default: []
        description: >
          Additional required or secondary hard targets. The primary is always
          a required comparison, even when this list omits it. An experiment is
          eligible when it improves at least one required objective beyond the
          comparison threshold and does not violate any other required
          objective. Completion via target_reached requires every declared
          required target. A spec without metric.objectives keeps single-primary
          acceptance: the primary is the only required objective.
        items:
          type: object
          required_children:
            name:
              type: string
              description: "指标名称：必须与测量命令的 JSON 输出中的键匹配"
            direction:
              type: enum
              values:
                - maximize
                - minimize
          optional_children:
            role:
              type: enum
              values:
                - required
                - secondary
              default: required
              description: "参与资格和完成所需的目标；仅记录次要目标"
            type:
              type: enum
              values:
                - hard
              default: hard
              description: "总是很难。附加目标来自测量命令。"
            target:
              type: number
              default: null
              description: "宣布该目标的成功价值。 target_reached 需要设定此目标的每个必需目标。"
            max_regression:
              type: object
              description: "可选的显式违反界限。设置后，违规使用此界限而不是比较阈值，包括当界限较宽松时。未设置时，比较阈值回归是违规的。"
              required_children:
                type:
                  type: enum
                  values:
                    - relative
                    - absolute
                value:
                  type: number

      diagnostics:
        type: array
        default: []
        description: "记录指标是为了理解，但从未开启。对于理解主要指标发生变化的原因很有用。"
        items:
          type: object
          required_children:
            name:
              type: string
              description: "指标名称：必须与测量命令的 JSON 输出中的键匹配"

      judge:
        type: object
        description: "法学硕士作为法官的配置。当 metric.primary.type 为 'judge' 时需要。当类型为“hard”时被忽略。"
        required_when: "metric.primary.type == 'judge'"
        required_children:
          rubric:
            type: string
            description: "发送给判断模型的多行标题文本。必须指示法官返回JSON。"
            example: |
              Rate this cluster 1-5:
              - 5: All items clearly about the same issue/feature
              - 4: Strong theme, minor outliers
              - 3: Related but covers 2-3 sub-topics
              - 2: Weak connection
              - 1: Unrelated items grouped together
          scoring:
            type: object
            required_children:
              primary:
                type: string
                description: "判断JSON输出中用作主要优化目标的字段名称"
                example: "mean_score"
            optional_children:
              secondary:
                type: array
                default: []
                description: "要记录的其他评分字段（未针对其进行优化）"
        optional_children:
          model:
            type: enum
            values:
              - cheap    # the host's fastest, lowest-cost tier
              - strong   # the host's most capable tier
            default: cheap
            description: "法官的能力等级。主动线束将层解析为具体模型；该规范从未提及其中之一。俳句和十四行诗的传统价值观被解读为廉价而强大。"
          confirmation_seed:
            type: integer
            default: null
            description: "第二个、保留的裁判样本的种子仅在保持之前和最终确认时得分。必须不同于 sample_seed。仅使用不同的种子并不能使样本保留下来：仅从选择样本未提取的相同输出的项目中提取样本，因此两者不共享任何项目。没有项目留在选择样本之外的输出无法通过这种方式确认，因此不保留其候选；输出那么小的规范需要measurement.holdout.command。这是未设置measurement.holdout时的判断型holdout；请参阅保留验证规则。"
          calibration:
            type: object
            default: null
            description: "法官按照人的评分方式评分的可选证据，在设置标签时在第一阶段进行检查。如果没有它，批准门就表明法官不受控制。仅当运行在回合结束后通过唤醒在滴答之间等待时才需要（标签或显式放弃）。"
            optional_children:
              labels:
                type: string
                default: null
                description: "人工标记样本的路径：带有用户评分的项目以及给出的原因。第 1 阶段在引导检查期间为用户写入（默认<state-root>/judge-labels.yaml）；保存在存储库中的样本可以在运行中重复使用。大约十个项目显示出一种模式； 20-50 使协议数字可靠。"
              min_agreement:
                type: number
                default: 0.8
                description: "法官的分数必须与人类标签一致才能接受安全带的标记项目的分数。"
              waived:
                type: boolean
                default: false
                description: "仅当用户明确放弃对原本需要校准的运行进行校准时，才为 true。在实验日志的 harness_validation 中记录谁放弃以及何时放弃。"
          sample_size:
            type: integer
            default: 10
            description: "每个实验进行评审评估的输出项目总数"
          stratification:
            type: array
            default: null
            description: "分层采样桶。如果为空，则使用均匀随机抽样。"
            items:
              type: object
              required_children:
                bucket:
                  type: string
                  description: "该层的存储桶名称"
                count:
                  type: integer
                  description: "从此存储桶中采样的项目数"
          singleton_sample:
            type: integer
            default: 0
            description: "用于假阴性评估的采样单项数量"
          singleton_rubric:
            type: string
            default: null
            description: "用于评估采样单例的标题。如果 singleton_sample > 0，则为必需。"
          sample_seed:
            type: integer
            default: 42
            description: "固定种子用于跨实验的可重复采样"
          batch_size:
            type: integer
            default: 5
            description: "每个判断子代理批次的样品数量。控制并行性与开销。"
          minimum_improvement:
            type: number
            default: 0.3
            description: "接受实验“更好”所需的最低评判分数提高。当输出结构在实验之间发生变化时考虑样本组成差异。与measurement.stability.noise_threshold不同，后者处理运行期间的不稳定情况。"
          max_total_cost_usd:
            type: number
            default: 5
            description: "不要启动法官通行证，其估计成本将使累计法官支出超过此上限。只计算裁判打分；停止。max_total_cost_usd 限制整个运行。这是首次运行的安全默认值；仅在标题和安全带值得信赖后才提出它。仅在用户明确批准的情况下设置为 null。"

  measurement:
    type: object
    description: "如何运行测量线束"
    required_children:
      command:
        type: string
        description: "运行评估并将 JSON 输出到标准输出的 Shell 命令。 JSON 必须包含与所有门名称和诊断名称匹配的键。"
        example: "python evaluate.py"
    optional_children:
      timeout_seconds:
        type: integer
        default: 600
        description: "测量命令在被终止之前运行的最大秒数"
      output_format:
        type: enum
        values:
          - json
        default: json
        description: "测量命令的标准输出的格式。目前仅支持JSON。"
      working_directory:
        type: string
        default: "."
        description: "测量命令的工作目录，相对于存储库根目录"
      holdout:
        type: object
        default: null
        description: >
          A held-out confirmation set the loop never selects or generates
          hypotheses from. Scored only before a keep and at final
          confirmation. When configured, a keep requires the holdout comparison
          to agree with the selection comparison (decide.mjs takes the second
          snapshot pair as `holdout` and returns `next_measurement: holdout`
          when it is still missing). Required when metric.primary.type is
          'judge' and when the run waits between ticks through a wake after
          turn end; otherwise optional, and its absence is stated in the
          Phase 1 approval presentation.
        optional_children:
          command:
            type: string
            default: null
            description: "在保留的集合上运行线束并打印与测量命令相同的 JSON 形状的 Shell 命令。对于初级判断，metric.judge.confirmation_seed可以代替这个命令。"
      per_case:
        type: boolean
        default: false
        description: "当为真时，测量JSON还携带一个`cases`对象，将稳定的案例ID映射到布尔值pass/fail（接受1/0）。 decide.mjs然后报告`regressions`：参考通过而候选人失败的情况。仅报告；它不会改变决定。"
      stability:
        type: object
        default: { mode: "stable" }
        description: "如何处理运行中的指标方差"
        required_children:
          mode:
            type: enum
            values:
              - stable   # run once, trust the result
              - repeat   # run N times, aggregate
              - ladder   # smoke, one paired exploratory sample, adaptive extras, full protocol only before keep
            default: stable
        optional_children:
          repeat_count:
            type: integer
            default: 5
            description: "模式为“重复”时运行线束的次数，以及模式为“阶梯”时的确认样本计数"
          aggregation:
            type: enum
            values:
              - median
              - mean
              - min
              - max
            default: median
            description: "如何将重复测量值合并为单个值"
          noise_threshold:
            type: number
            default: 0.02
            description: "当 Comparison.method 为绝对值（默认值）时必须超过的绝对改进。仅适用于硬指标。"
          comparison:
            type: object
            default: { method: "absolute" }
            description: "如何决定保留/恢复/不确定。 Unset 方法保留了传统的绝对 noise_threshold 规则。"
            required_children:
              method:
                type: enum
                values:
                  - absolute
                  - relative
                  - paired
                default: absolute
                description: "绝对使用noise_threshold；相对使用relative_threshold；配对使用样本范围/配对差异，可能会返回不确定的结果"
            optional_children:
              relative_threshold:
                type: number
                default: 0.05
                description: "当方法是相对或配对时，当前最佳值的分数算作实际变化"
          ladder:
            type: object
            description: "成本意识测量阶段。当模式为梯形时使用；否则忽略。"
            optional_children:
              smoke_command:
                type: string
                default: null
                description: "便宜的正确性检查。失败是退化的并且跳过定时测量。"
              exploratory_pairs:
                type: integer
                default: 1
                description: "在决定是否花费更多之前配对探索性样本。必须是正整数。"
              confirmation_repeats:
                type: integer
                default: null
                description: "保留前的完整协议样本计数。默认为 repeat_count。必须是至少与exploratory_pairs一样大的正整数。"
              futility:
                type: object
                description: "预先宣布的中止注定是一场明显非竞争性的现场比赛"
                optional_children:
                  worse_factor:
                    type: number
                    default: 1.2
                    description: "如果候选值比当前最佳值差很多倍，则在第一个样本之后进行审查（最小化：候选值 >= 最佳 * 因子）"
                  after_elapsed_seconds:
                    type: number
                    default: null
                    description: "一旦经过的时间达到这个界限，就审查仍然非竞争性的实时运行。设置后，必须为正数。"

  scope:
    type: object
    description: "实验代理可以修改什么"
    required_children:
      mutable:
        type: array
        description: "代理在实验期间可能修改的文件和目录"
        items:
          type: string
          description: "文件路径或目录（相对于存储库根目录）。目录匹配其中的所有文件。"
        example:
          - "src/clustering/"
          - "src/preprocessing/"
          - "config/clustering.yaml"
      immutable:
        type: array
        description: "代理不得修改文件和目录。测量工具应始终列在此处。"
        items:
          type: string
        example:
          - "evaluate.py"
          - "tests/fixtures/"
          - "data/"

# ============================================================================
# 可选字段
# ============================================================================

optional_fields:

  execution:
    type: object
    default: { mode: "parallel", backend: "worktree", max_concurrent: 4 }
    description: "实验是如何进行的"
    optional_children:
      mode:
        type: enum
        values:
          - parallel  # run experiments simultaneously (default)
          - serial    # run one at a time
        default: parallel
      backend:
        type: enum
        values:
          - worktree  # git worktrees for isolation (default)
          - codex     # Codex sandboxes for isolation
          - remote    # detached workers with their own checkout; results arrive as a pushed ref or store file
        default: worktree
        description: "进行实验的地方。远程需要独立工作人员能力（SKILL.md执行面）；如果没有，运行就会回到工作树。远程工作人员在自己的机器上进行配对测量，因此需要相对或配对比较。"
      max_concurrent:
        type: integer
        default: 4
        minimum: 1
        description: "并行运行的最大实验。工作树后端的上限为 6。 8+ 仅对 Codex 或远程后端有效。对于远程，这限制了派遣的工作人员，而不是本地工作树。"
      max_experiments_per_tick:
        type: integer
        default: null
        minimum: 1
        description: "在循环的一个周期（一批）中调度的实验的可选上限。限制单个唤醒或会话在检查点之前执行的操作。未设置意味着 max_concurrent 单独限制批次。"
      codex_security:
        type: enum
        values:
          - full-auto                                # --full-auto (workspace write)
          - yolo                                     # --dangerously-bypass-approvals-and-sandbox
        default: null
        description: "Codex 安全态势。如果为空，则每个会话都会询问用户一次。"

  parallel:
    type: object
    default: {}
    description: "在第 1 阶段发现或设置的并行配置"
    optional_children:
      port_strategy:
        type: enum
        values:
          - parameterized  # use env var for port
          - none           # no port parameterization needed
        default: null
        description: "如果为空，则在第 1 阶段并行性探测期间自动检测"
      port_env_var:
        type: string
        default: null
        description: "端口参数化的环境变量名称（例如，EVAL_PORT）"
      port_base:
        type: integer
        default: null
        description: "基本端口号。每个实验得到 port_base + experiment_index。"
      shared_files:
        type: array
        default: []
        description: "必须复制到每个实验工作树中的文件（例如 SQLite 数据库）"
        items:
          type: string
      exclusive_resources:
        type: array
        default: []
        description: "需要独占访问的资源（例如“gpu”）。如果非空，则强制串行模式。"
        items:
          type: string

  dependencies:
    type: object
    default: { approved: [] }
    description: "实验的依赖管理"
    optional_children:
      approved:
        type: array
        default: []
        description: "预先批准的实验可能添加的新依赖项"
        items:
          type: string

  constraints:
    type: array
    default: []
    description: "实验代理必须遵循的自由文本约束"
    items:
      type: string
    example:
      - "Do not change the output format of clusters"
      - "Preserve backward compatibility with existing cluster consumers"

  stopping:
    type: object
    default: { max_iterations: 100, max_hours: 8, max_wall_hours: 72, plateau_iterations: 10, target_reached: true }
    description: "优化循环何时应停止。任何标准都可以触发停止。"
    optional_children:
      max_iterations:
        type: integer
        default: 100
        description: "经过这么多次实验后停止"
      max_hours:
        type: number
        default: 8
        description: "在这么多活动时间后停止：自第 3 阶段开始以来在循环滴答内花费的时间，跨滴答的总和。滴答之间等待所花费的时间不计算在内。在一次不间断的会话中，这相当于挂钟时间。"
      max_wall_hours:
        type: number
        default: 72
        description: "日历逆止：自第 3 阶段开始以来经过这么多小时后停止，无论运行是否处于活动状态。没有唤醒或恢复可以延长它。必须 >= max_hours。"
      plateau_iterations:
        type: integer
        default: 10
        description: "如果连续多次实验没有改善，则停止"
      target_reached:
        type: boolean
        default: true
        description: "当主要指标达到目标值（如果设置）时停止"
      max_total_cost_usd:
        type: number
        default: null
        description: "不要启动一个调度，其估计成本将使整个运行（实验人员、法官和研究子代理）的模型支出超过此上限。根据主机报告的使用情况（如果可用）计算，并以其他方式进行估计。"

  max_runner_up_merges_per_batch:
    type: integer
    default: 1
    description: "在保留最佳实验后，每批次尝试合并的文件不相交亚军实验的最大数量"

# ============================================================================
# 验证规则
# ============================================================================

validation_rules:
  - "All required fields must be present"
  - "name must be lowercase kebab-case (`^[a-z0-9]+(?:-[a-z0-9]+)*$`)"
  - "metric.primary.type must be 'hard' or 'judge'"
  - "If metric.primary.type is 'judge', metric.judge must be present with rubric and scoring"
  - "metric.degenerate_gates must have at least one entry"
  - "measurement.command must be a non-empty string"
  - "scope.mutable must have at least one entry"
  - "scope.immutable must have at least one entry"
  - "Gate check operators must be one of: >=, <=, >, <, ==, !="
  - "execution.max_concurrent must be >= 1"
  - "execution.max_concurrent must not exceed 6 when execution.backend is 'worktree'"
  - "execution.backend must be one of: worktree, codex, remote"
  - "If execution.backend is 'remote', measurement.stability.comparison.method must be 'paired' or 'relative'; absolute numbers from different machines are not comparable"
  - "If parallel.exclusive_resources is non-empty, execution.mode should be 'serial'"
  - "If metric.judge.singleton_sample > 0, metric.judge.singleton_rubric must be present"
  - "If metric.primary.type is 'judge' and metric.judge.max_total_cost_usd is null, the user should explicitly approve uncapped spend"
  - "stopping must have at least one non-default criterion or use defaults"
  - "stopping.max_total_cost_usd, when set, must be a positive number"
  - "If metric.objectives is set, each additional objective is a hard metric whose name is unique and matches a measurement JSON key"
  - "The primary is always a required comparison, including when metric.objectives omits it"
  - "If measurement.stability.mode is 'ladder', comparison.method should be relative or paired unless the user explicitly keeps absolute"
  - "A spec without metric.objectives keeps single-primary acceptance"
  - "comparison.method, when set, must be one of: absolute, relative, paired"
  - "If measurement.stability.mode is 'ladder', exploratory_pairs and confirmation_repeats (or repeat_count) must be positive integers, and confirmation must be at least exploratory_pairs"
  - "futility.after_elapsed_seconds, when set, must be a positive number"
  - "stopping.max_wall_hours must be a positive number and at least stopping.max_hours"
