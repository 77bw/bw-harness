# Compound Engineering -- 仓库配置
# ce-config-template-version: 3
# 复制到项目根目录中的 .compound-engineering/config.yaml（团队默认值）。
# 可选覆盖：.compound-engineering/config.local.yaml，相同的键。
# 普通按键：设置后本地获胜，然后这个文件，然后技能默认。
# docs_root 是 repo 布局——仅在此处设置；本地 docs_root 被忽略。
# 所有设置都是可选的。无效的普通值继续到下一层。
# docs_root 无法关闭不可用的值。

# --- Artifact root ---
# 重新定位每个 CE 编写的工件文件夹（解决方案、计划、构想、
# 解释者、脉搏报告、狗粮报告、
# 反馈扫描、角色）位于一个存储库相对根下。未设置 -> `docs`,
# 与今天的字节相同。配置的根成为 CE 读取的唯一位置
# 并写道； CE 永远不会退回到阅读`docs/`。
#
# 仅在此跟踪文件中设置此项，以便每个克隆和工作树共享一个
# 神器树。 config.local.yaml 中的docs_root 会被忽略。
#
# 该值必须是存储库相对目录，其真实（符号链接解析）路径
# 保留在存储库内部，不是存储库根本身，并且不在 `.git/` 下。
# 与此处的所有其他设置不同，不可用的值不会落入
# 默认值——CE 因错误而停止，因此拼写错误无法静默地将工件写入
# 您配置的远离的位置。 `/ce-setup` 报告已解析的根。

# docs_root: .compound-engineering/artifacts   # 存储库相对目录（默认：docs）

# --- Product pulse ---
# 现有产品脉冲配置的兼容性键；这个捆绑包没有设置它们。

# pulse_product_name: "Spiral"                          # 用于报告标题（无默认值）
# pulse_lookback_default: 24h                           # 1小时| 24小时 | 7 天 | 30 天（默认：24 小时）
# pulse_primary_event: "session_started"                # 表示“用户出现”的事件
# pulse_value_event: "task_completed"                   # 意味着“用户获得价值”的事件
# pulse_completion_events: "onboarded,first_purchase"   # 以逗号分隔，0-3 个事件
# pulse_quality_scoring: false                          # 真实 | false（默认值：false；仅限AI产品）
# pulse_quality_dimension: "answer accuracy"            # 当 pulse_quality_scoring 为 true 时，维度得分为 1-5
# pulse_analytics_source: posthog                       # 邮差 |混合面板|自定义（无默认值）
# pulse_tracing_source: sentry                          # 哨兵|数据狗 |自定义（无默认值）
# pulse_payments_source: stripe                         # 条纹|自定义（无默认值）
# pulse_db_enabled: false                               # 真实 | false（默认值：false；如果 true，则只读 DB）
# pulse_metric_sources: "retention_d7=posthog,nps=delighted"  # 策略度量 -> 源覆盖；以逗号分隔的“metric=source”对；未列出的指标回落至 pulse_analytics_source
# pulse_pending_metrics: "retention_d7,nps"             # 等待检测的逗号分隔策略指标；呈现为“无数据”
# pulse_excluded_metrics: "north_star"                  # 逗号分隔的策略指标故意不在脉冲中

# --- Output format ---
# 每个技能的默认输出格式。选择工件的专用格式
# 写入： `md` 生成一个 markdown 文件，`html` 生成一个单个
# 独立的 HTML 文件。两者是相互排斥的——不存在
# 兄弟神器。请参阅DESIGN.md或您的代理人指示来影响
# HTML 样式。优先级：运行提示中的格式请求优先
# （例如“output:html”或“使其成为 HTML”）；您之前建立的偏好
# （在会话中、保存到内存中或在您的代理指令中）会覆盖这些
# 键（此配置是持久后备）。无头或管道运行
# 以同样的方式解析格式；没有任何力量`md`。

# plan_output: html              # 医学博士 | html（默认：md）
# brainstorm_output: html        # 医学博士 | html（默认：md）
# ideate_output: md              # 医学博士 | html （默认值：html——ideation 文档是面向人的，因此 HTML 是默认值；将 md 设置为选择退出）

# --- Model elevation ---
# 仅发送/ce-plan的推理重步骤（解释研究，然后作者
# 计划）和 /ce-brainstorm（生成方法）到您命名的模型。其余的部分
# 每项技能——对话、研究、编排——都留在你的会话中
# 模型。该值是模型别名（例如 `fable`、`opus`）。您还可以命名一个
# 一次性提示中的模型，它会覆盖这些键。
#
# Cross-harness: setting a key means every harness you run these skills in will
# 尝试该模型。主机尽可能以本地方式提供服务；否则
# Claude CLI 在安装并验证时被调用；否则该步骤将运行
# 在你的会话模型上，运行是这样说的。 Invalid/commented/missing -> 没有
# 海拔。
#
# `plan_effort`和`brainstorm_effort`分别设置推理工作量
# 升高的步长以（低、中、高、xhigh、最大之一）运行。取消设置保留
# 现有默认值：Claude CLI 路线上的高位，本机上的线束默认值
# 派遣。无法识别的值是无效的——它会被拒绝并且运行会跳过
# 提升，而不是默默地使用与配置不同的努力。如果
# 主机的本机子代理工具无需任何努力设置，该步骤仍然运行
# 在那里，运行表明未应用配置的工作。

# plan_model: fable              # 用于计划创作的模型别名；烘烤运行时候选人的偏好（无默认值）
# brainstorm_model: fable        # 用于生成方法的模型别名；烘烤运行时候选人的偏好（无默认值）
# plan_effort: high              # 低|中等|高| x高 |最大（默认值：高）
# brainstorm_effort: high        # 低|中等|高| x高 |最大（默认值：高）

# --- PR concept teaching (ce-commit-push-pr) ---
# 当 PR 向代码库引入新概念时，生成的 PR
# 描述获得了“新概念”部分的教学。部分切换是
# 单门：off禁用判断，节，/ce-explain报价，
# 和档案。档案另外将解释器写入docs/explainers/
# 并从 PR 链接它（仅完整工作流程运行；每次运行覆盖
# archive:on|off). Ordinary cascade: local, then this file, then the skill default.

# pr_teaching_section: false     # 真实 |假（默认值：真）
# pr_teaching_archive: true      # 真实 | false（默认值：false；仅运行完整工作流程）

# --- ce-commit-push-pr babysit handoff ---
# 完整工作流程PR打开后，ce-commit-push-pr自动调用ce-babysit-pr
# 观看 CI + 传入评论并推动 PR 走向合并就绪。设置为假
# 选择退出（每次运行覆盖：babysit:off令牌）。这规定了
# 仅限站岗值班——lfg的管道内保姆受到限制（3轮修复）并且
# 仍然运行，因为这是管道达到“CI决定”的方式。
# auto_babysit: false            # 真实 |假（默认值：真）

# --- ce-plan scoping confirmation ---
# 默认情况下 /ce-plan 在 research/plan-write 之前暂停以显示范围
# 总结并等待您确认范围。设置此以跳过等待：ce-plan
# 为自己撰写摘要，记录任何推断的范围
# 假设部分，宣布它正在进行中，并继续进行。它会跳过
# 只有那个确认——真正的阻塞问题和计划后菜单
# 仍然出现。使用 `confirm:auto`（跳过）或 `confirm:ask` 覆盖每次运行
# （强制门打开一次）。

# plan_skip_scoping_confirm: true   # 真实 |假（默认值：假）

# --- Cross-model review policy and preference ---
# `cross_model_review_mode`决定ce-doc-review和ce-code-review是否可以
# 自动将审核内容（差异、文档）发送到第二个模型
# 当条件跨模型传递激活时提供者。 `off` 跳过
# 在选择任何路线或流程开始之前通过，离开每个本地
# 审阅者就位，并报告“由结帐配置禁用”而不是
# 可用性故障。 `auto` 保持当前行为。直接请求
# 对话（“这次使用法典作为独立审阅者”）覆盖
# `off` 为该运行；对话禁止优先于`auto`。
#
# `cross_model_peer` 是首选对等体，仅在模式为时进行协商
# `auto`。对话指令仍然获胜，并且技能会跳过那些
# 无法建立所需的 host/peer 区别。
# `cross_model_model` 和 `cross_model_effort` 固定模型和推理
# 无论哪个同行目标运行的努力； unset 保留技能的编辑
# 映射。该模型必须属于该目标的系列（别名，例如
# `fable` 或完整 ID，例如 claude 的 `claude-opus-5-5`； `gpt-*` 对于法典，
# 可选的命名空间限定，例如当 Codex CLI 时为 `openai.gpt-6.1-sol`
# 通过非默认 `model_provider` 的路由；一个 `gemini-*` id 例如
# `gemini-3.8-flash` 反重力； opencode 的 `provider/model` id 和
# 圆周率）。
# 努力程度：克劳德低|中|高|x高|最大，法典低|中|高|
# xhigh 加上 max 和 ultra 在列出它们的型号上，grok low|medium|high|
# xhigh，反重力低|中|高，OpenCode 2.x 无|低|中|高|xhigh|
# 每个模型列出的最大值； cursor/composer 和 pi 路线不采取任何措施。 A 重视同行
# 无法兑现以明确的理由跳过传球——从未被替换。

# cross_model_review_mode: off   # 汽车 |关闭（默认值：自动）
# cross_model_peer: codex          # 法典|克劳德|格洛克|反重力|光标|作曲家 |开放代码 |圆周率
# cross_model_model: fable         # 已解析对等目标的模型别名或完整 ID（无默认值）
# cross_model_effort: xhigh        # 已解析对等目标的推理工作（无默认值）

# --- Review subagent model ---
# `review_subagents` 为每个子代理设置模型和推理工作
# ce-code-review 和 ce-doc-review 在同一主机上生成（审阅者、检查者、
# 验证器），每个线束。仅当前线束的条目适用；一个领域
# 省略则保留该技能的默认值。默认值：在 Codex 中，gpt-6.1-terra 处于高位
# 对于每个子代理；在其他地方，每个审稿人都有自己的级别。一个模型命名为
# 对话或项目的说明获胜。被主人拒绝的模特
# 回退到会话模型一次，评论也是如此。

# review_subagents:
#   codex:
#     model: "gpt-6.1-terra"
#     effort: high
#   claude:
#     model: sonnet

# --- ce-work implementation engine ---
# 对实施单元作者的长期偏好。居住
# task/session/project 说明和 LFG 的出处绑定可能
# 覆盖或缩小这些默认值。 `off` 仅禁用此站立首选项。
# `prefer` 按顺序尝试候选者，然后通过披露自然回退。
# `require` 在可行的同时保持所请求的外部身份固定，然后也
# 如果路由不可用，则本机回退并公开。安全带：
# 法典|克劳德|格洛克|反重力|光标|开放代码 |圆周率。省略模型以使用该线束的配置
# 默认。作曲家是一个模特
# 系列通过 Cursor：{harness：cursor，model：composer }。不要放置 CLI 标志
# 或此处的命令。跳过相当于当前host/default的候选者；
# 同一线束中的不同显式模型仍然符合资格。

# work_engine_mode: prefer        # 关闭 |更喜欢|需要（默认：关闭）
# work_engine_preferences:
#   - harness: cursor
#     model: composer
#   - harness: codex
#     model: "gpt-6.1-sol"
#   - harness: claude             # 配置的默认模型

# 根据线束，外部工作人员的推理工作。每个值都是其中之一
# 利用自己的努力水平。未设置的线束保留其自己的默认值：
# Codex 和克劳德处于高位，原生 Grok 位于 xhigh，反重力处于高位（需要
# 低|中|高)。 OpenCode (2.x) 保留其自己的每个模型默认值并采用
# none|low|medium|high|xhigh|max，因为每个模型都列出了它们。光标路线不采取
# 努力。 config.local.yaml 中的一张地图取代了这个。

# work_engine_effort:
#   codex: xhigh
#   claude: max

# --- ce-promote ---
# 当您拒绝 /ce-promote 中的 Spiral 设置优惠时自动写入。
# 抑制该项目中的一次性设置推动。拔下钥匙即可重新启用。

# ce_promote_spiral_optout: true   # 真实 | （缺席）（默认：缺席——提供一次）

# --- Sweep (ce-sweep) ---

# 反馈来源扫过/ce-sweep。通用键：其他技能可以阅读此列表。
# 每个条目：类型（slack | github-issues | email）、id（短名称）、目标（通道 ID /
# owner/repo / 邮箱）、ack_action、closeout_action、敏感（true 会保留内容
# 来自提交的state/plan文本），已批准（源端写入的长期批准）。
# feedback_sources:
#   - { type: slack, id: slack-alpha, target: C0XXXXXXX, ack_action: eyes, closeout_action: white_check_mark, sensitive: false, approved: true }
#   - { type: github-issues, id: gh-issues, target: owner/repo, ack_action: "feedback:ack", closeout_action: "feedback:resolved", sensitive: false, approved: true }

# 扫一扫拥有的设置。
# sweep_state_path: docs/feedback-sweep/state.yml   # 已提交（多代理）或 /tmp 路径（单人）
# sweep_ack_cap: 25                                 # 在断路器之前每次运行每个源的最大确认数
# sweep_lease_ttl_minutes: 60                       # 单写入者租约陈旧阈值
# sweep_shared_branch: false                        # true：共享文档分支拓扑的推送门控租赁

# --- Compound Packs ---

# 规划阅读和引用的规范性领域知识文件夹。
# 已声明，从未扫描：条目命名源（存储库相对路径，
# ~/绝对路径，或 git URL）以及从中安装的内容。一览从这里
# 文件和配置。local.yaml连接——本地添加包，从不替换
# 团队的。 Git 源需要 ref （标签或 sha 精确复制；一个分支
# 冻结在其缓存的分辨率上并且可以在机器之间漂移）。路径： 和
# 粘贴的 GitHub /tree/<ref>/<sub> URL 将源范围限制为子文件夹。
# pack 字段选择一个 id 或一个列表；省略它来安装所有内容
# 来源发布。 id 字段重命名单包条目。
# 规则是顶级.md文件，标题+applies_when；子文件夹是存储。

# packs:
#   - source: compound-packs/local-rules                       # 存储库相关，实时阅读
#   - source: ~/compound-packs/kk-style                        # 机器本地，实时读取
#   - source: https://github.com/org/rails-ce-pack    # git，缓存在 ref 处
#     ref: v1.2.0
#     pack: [rails, inertia]
